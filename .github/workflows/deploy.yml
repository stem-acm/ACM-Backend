name: Build & Deploy API
on:
  push: { branches: [master, develop] }
  workflow_dispatch:

permissions: { contents: read, packages: write }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.meta.outputs.tag }}" }
    steps:
      # master deploys production and develop deploys staging. Any other ref
      # (a manual run from a feature branch or a tag) stops here: no image, no deploy.
      - name: Check the branch
        if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'
        run: |
          echo "::error::This workflow deploys only master (production) and develop (staging), not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/stem-acm/acm-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/stem-acm/acm-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 187.126.29.40
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/infra/${{ github.ref_name == 'master' && 'ipass' || 'ipass-staging' }}
            ./scripts/deploy.sh api ${{ needs.build.outputs.tag }}
